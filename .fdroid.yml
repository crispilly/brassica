Name: Brassica
Summary: Free recipe manager with import, categories, cooking mode and optional sync
Description: |-
  Brassica is a free and open source recipe manager for Android.

  Recipes are stored locally on the device. The app supports recipe images,
  ingredients, directions, notes, nutrition information, favorites, seasonal
  recipes and categories. Multiple categories can be combined using OR or AND
  matching.

  Brassica can import and export .broccoli and .broccoli-archive files.
  Public recipe shares can be imported using links or QR codes.

  The app works fully offline without an account or server. Synchronization
  with a Brassica Web installation is optional.

  Brassica is a fork of the free Broccoli app.

