name: Publish Brassica 2.0 release

on:
  push:
    paths:
      - '.github/workflows/release-2.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build installable Android APK
        working-directory: android
        run: ./gradlew assembleFdroidDebug

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release/Brassica-Web-2.0
          cp -a web/. release/Brassica-Web-2.0/
          rm -f release/Brassica-Web-2.0/storage/database/brassica.sqlite
          find release/Brassica-Web-2.0/storage -type f ! -name '.gitkeep' -delete

          (
            cd release
            zip -qr Brassica-Web-2.0.zip Brassica-Web-2.0
          )

          cp android/app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk release/Brassica-Android-2.0.apk

          (
            cd release
            sha256sum Brassica-Web-2.0.zip Brassica-Android-2.0.apk > SHA256SUMS.txt
          )

          cat > release/RELEASE_NOTES.md <<'EOF'
          # Brassica 2.0

          Brassica 2.0 enthält die Webanwendung und die Android-App im gemeinsamen Monorepo.

          ## Web 2.0

          - zentraler Front Controller und Routing
          - nur `public/` als DocumentRoot
          - private SQLite-Daten und Laufzeitdaten unter `storage/`
          - Browser-Erstinstallation ohne Shell
          - Multikategorie-Filter mit ODER/UND
          - Kochmodus mit großen, seitenweisen Schritten und Screen Wake Lock
          - Sync-API v1 für Brassica Android
          - vorhandener Import/Export für `.broccoli` und `.broccoli-archive`

          ## Android 2.0

          - Application-ID `de.crispilly.brassica`
          - Brassica-Logo identisch zur Webversion
          - Multikategorie-Filter mit ODER/UND
          - Import von `.broccoli` und `.broccoli-archive`
          - robuster Bildimport für JPG/JPEG/PNG/WebP
          - Export einzelner Rezepte als `.broccoli`
          - Export mehrerer Rezepte als `.broccoli-archive`
          - bestehende Backup-/Restore-Funktion bleibt erhalten
          - Web-Sync mit Vorschau und Auswahl einzelner Rezepte/Kategorien

          ## Installation Web

          Das ZIP entpacken, `public/` als DocumentRoot setzen und Brassica im Browser öffnen.
          Beim ersten Aufruf wird die SQLite-Datenbank automatisch erzeugt und der erste Admin im Browser angelegt.

          ## Android APK

          Das bereitgestellte APK ist direkt installierbar. Es wird im CI als F-Droid-Debug-Variante gebaut und daher mit dem Android-Debugschlüssel signiert.
          Für eine dauerhaft updatefähige produktive APK ist später ein eigener stabiler Release-Signing-Key erforderlich.

          ## Prüfsummen

          Siehe `SHA256SUMS.txt`.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.0 \
            --target "${GITHUB_SHA}" \
            --title "Brassica 2.0" \
            --notes-file release/RELEASE_NOTES.md \
            release/Brassica-Web-2.0.zip \
            release/Brassica-Android-2.0.apk \
            release/SHA256SUMS.txt
