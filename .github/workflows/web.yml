name: Web checks

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite

      - name: PHP syntax check
        run: find web -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Visible Web version matches VERSION file
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < web/VERSION)
          grep -F "content: \"Brassica $VERSION\";" web/public/assets/css/app.css

      - name: Browser-installer database smoke test
        run: |
          set -euo pipefail
          rm -f web/storage/database/brassica.sqlite
          php -r "require 'web/app/bootstrap.php'; Brassica\\Core\\Installer::ensureReady(); if (!is_file(storage_path('database/brassica.sqlite'))) { exit(1); } if (!Brassica\\Core\\Installer::needsSetup()) { exit(2); }"
          test -s web/storage/database/brassica.sqlite
          rm -f web/storage/database/brassica.sqlite

      - name: Brassica 1.x migration smoke test
        run: |
          set -euo pipefail
          rm -rf web/data
          rm -f web/storage/database/brassica.sqlite web/storage/logs/v1-migration.json
          find web/storage/images -type f ! -name '.gitkeep' -delete
          find web/storage/imports/archives -type f ! -name '.gitkeep' -delete

          mkdir -p web/data/images web/data/uploads/archives

          php -r '
            $pdo = new PDO("sqlite:web/data/db.sqlite");
            $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
            $pdo->exec(file_get_contents("web/database/schema.sql"));
            $pdo->exec("INSERT INTO users (username,password_hash,created_at) VALUES (\"legacy-admin\",\"hash\",\"2026-01-01T00:00:00+00:00\")");
          '

          printf 'legacy-image' > web/data/images/legacy.jpg
          printf 'legacy-archive' > web/data/uploads/archives/legacy.broccoli

          php -r '
            require "web/app/bootstrap.php";
            Brassica\Core\Installer::ensureReady();
            if (!is_file(storage_path("database/brassica.sqlite"))) exit(10);
            if (Brassica\Core\Installer::needsSetup()) exit(11);
            if (!is_file(storage_path("images/legacy.jpg"))) exit(12);
            if (!is_file(storage_path("imports/archives/legacy.broccoli"))) exit(13);
            if (!is_file(storage_path("logs/v1-migration.json"))) exit(14);
            $pdo = Brassica\Core\Database::connection();
            if ((int)$pdo->query("SELECT COUNT(*) FROM users")->fetchColumn() !== 1) exit(15);
          '

          rm -rf web/data
          rm -f web/storage/database/brassica.sqlite web/storage/logs/v1-migration.json
          find web/storage/images -type f ! -name '.gitkeep' -delete
          find web/storage/imports/archives -type f ! -name '.gitkeep' -delete


      - name: Single-recipe share smoke test
        run: |
          set -euo pipefail
          rm -rf web/data
          rm -f web/storage/database/brassica.sqlite
          php -r '
            require "web/app/bootstrap.php";
            Brassica\Core\Installer::ensureReady();
            $pdo = Brassica\Core\Database::connection();
            $stmt = $pdo->prepare("INSERT INTO users(username,password_hash,created_at) VALUES(:u,:p,:c)");
            $stmt->execute([
              ":u" => "share-ci",
              ":p" => password_hash("share-ci-password", PASSWORD_DEFAULT),
              ":c" => date(DATE_ATOM),
            ]);
          '

          php -S 127.0.0.1:18081 -t web/public web/public/index.php >/tmp/brassica-share-php.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f web/storage/database/brassica.sqlite' EXIT
          sleep 1

          TOKEN_JSON=$(curl -fsS \
            -u 'share-ci:share-ci-password' \
            -H 'Content-Type: application/json' \
            -d '{"deviceId":"share-ci-device","deviceName":"Share CI"}' \
            http://127.0.0.1:18081/api/v1/sync/token)

          TOKEN=$(printf '%s' "$TOKEN_JSON" | php -r '$j=json_decode(stream_get_contents(STDIN),true); echo $j["token"]??"";')
          test -n "$TOKEN"

          SHARE_JSON=$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"recipe":{"uuid":"11111111-2222-4333-8444-555555555555","data":{"title":"Freigabe Test","description":"","directions":"","ingredients":"","notes":"","nutritionalValues":"","preparationTime":"","servings":"","source":"","favorite":false,"categories":[{"name":"Test"}]}}}' \
            http://127.0.0.1:18081/api/v1/share/recipe)

          SHARE_PATH=$(printf '%s' "$SHARE_JSON" | php -r '$j=json_decode(stream_get_contents(STDIN),true); echo $j["url"]??"";')
          test -n "$SHARE_PATH"
          printf '%s' "$SHARE_PATH" | grep -q '^/share/recipe/'

          curl -fsS "http://127.0.0.1:18081$SHARE_PATH" >/tmp/brassica-shared-recipe.html

          RID=$(php -r '
            require "web/app/bootstrap.php";
            $pdo = Brassica\Core\Database::connection();
            echo (int)$pdo->query("SELECT id FROM recipes WHERE title=\"Freigabe Test\" LIMIT 1")->fetchColumn();
          ')
          test "$RID" -gt 0

          SHARE_TOKEN=${SHARE_PATH##*/}

          # Direkte ID-Aufrufe dürfen für Gäste nicht mehr funktionieren.
          test "$(curl -sS -o /tmp/direct-view.html -w '%{http_code}' "http://127.0.0.1:18081/view.php?id=$RID")" = "404"
          test "$(curl -sS -o /tmp/direct-api.json -w '%{http_code}' "http://127.0.0.1:18081/api/recipe_get.php?id=$RID")" = "404"
          test "$(curl -sS -o /tmp/direct-download.bin -w '%{http_code}' "http://127.0.0.1:18081/editor.php?id=$RID&download=1")" = "404"

          # Derselbe Datensatz muss über den gültigen Freigabe-Token erreichbar sein.
          curl -fsS "http://127.0.0.1:18081/api/recipe_get.php?id=$RID&share_token=$SHARE_TOKEN" >/tmp/token-recipe.json
          curl -fsS "http://127.0.0.1:18081/editor.php?id=$RID&download=1&share_token=$SHARE_TOKEN" >/tmp/token-recipe.broccoli
          test -s /tmp/token-recipe.broccoli

          php -r '
            require "web/app/bootstrap.php";
            $pdo = Brassica\Core\Database::connection();
            if ((int)$pdo->query("SELECT COUNT(*) FROM recipe_shares")->fetchColumn() !== 1) exit(20);
            if ((int)$pdo->query("SELECT COUNT(*) FROM recipes WHERE title=\"Freigabe Test\"")->fetchColumn() !== 1) exit(21);
          '
