name: Build Brassica web token update ZIP

on:
  push:
    paths:
      - '.github/workflows/web-token-update-zip.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build update ZIP
        run: |
          set -euo pipefail
          cd web
          zip -r ../Brassica-Web-2.0.4-Token-Update.zip \
            app/Http/SyncController.php \
            app/Http/PublicShareController.php \
            app/Legacy/lib/share_access.php \
            app/Legacy/api/recipe_share.php \
            app/Legacy/api/recipe_get.php \
            app/Legacy/api/image.php \
            app/Legacy/api/recipe_clone_to_me.php \
            app/Legacy/api/recipes_export.php \
            app/Legacy/api/collections_recipes.php \
            app/Legacy/api/collections_create.php \
            app/Legacy/public/view.php \
            app/Legacy/public/editor.php \
            public/assets/js/app.js \
            public/assets/js/view.js \
            public/assets/js/index_open.js \
            config/routes.php

      - uses: actions/upload-artifact@v4
        with:
          name: Brassica-Web-2.0.4-Token-Update
          path: Brassica-Web-2.0.4-Token-Update.zip
          if-no-files-found: error
