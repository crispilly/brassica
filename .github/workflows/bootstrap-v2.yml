name: Bootstrap Brassica V2 repository

on:
  push:
    branches: [v2-monorepo]
    paths:
      - '.bootstrap/complete'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite

      - name: Reconstruct Brassica 2.0 monorepo
        run: |
          set -euo pipefail
          rm -rf /tmp/v2 /tmp/web.tar.gz /tmp/android.tar.gz /tmp/root.tar.gz /tmp/android_deleted.txt
          mkdir -p /tmp/v2/web

          cat .bootstrap/r-* | base64 -d > /tmp/root.tar.gz
          echo 'ec76bbc0a44fe2fc2357ff78515da409c39e019630ba62f57d181570bbde5e16  /tmp/root.tar.gz' | sha256sum -c -
          tar -xzf /tmp/root.tar.gz -C /tmp/v2

          cat .bootstrap/w-00 .bootstrap/w-01 .bootstrap/ww-* | base64 -d > /tmp/web.tar.gz
          echo '67cefcff8a6c91ec1b2be0de319dcc0eae785d3b02c5d1b4f2ad9e36d6477cc8  /tmp/web.tar.gz' | sha256sum -c -
          while IFS=$'\t' read -r src dst; do
            [ -n "$src" ] || continue
            mkdir -p "/tmp/v2/web/$(dirname "$dst")"
            cp -a "$src" "/tmp/v2/web/$dst"
          done < .bootstrap/web_moves.txt
          tar -xzf /tmp/web.tar.gz -C /tmp/v2/web

          git clone --depth 1 --branch v1.4.7 https://github.com/flauschtrud/broccoli.git /tmp/v2/android
          rm -rf /tmp/v2/android/.git
          cat .bootstrap/d-* > /tmp/android_deleted.txt
          while IFS= read -r f; do
            [ -n "$f" ] && rm -rf -- "/tmp/v2/android/$f"
          done < /tmp/android_deleted.txt
          cat .bootstrap/a-* | base64 -d > /tmp/android.tar.gz
          echo '96dcfe645a404346a5f0f101d6ffa04451df62042e6774f1aef7c5bc5cea6bc6  /tmp/android.tar.gz' | sha256sum -c -
          tar -xzf /tmp/android.tar.gz -C /tmp/v2/android

          if grep -Rni --exclude-dir=.git 'digitaldruckshop' /tmp/v2; then
            echo 'Forbidden branding found.' >&2
            exit 20
          fi
          if find /tmp/v2 -type f \( -name '*.sqlite' -o -name '*.db' \) -print -quit | grep -q .; then
            echo 'Runtime database found in source tree.' >&2
            exit 21
          fi

      - name: Web syntax and browser-first installer smoke test
        run: |
          set -euo pipefail
          find /tmp/v2/web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          rm -f /tmp/v2/web/storage/database/brassica.sqlite
          cd /tmp/v2
          php -r "require 'web/app/bootstrap.php'; Brassica\\Core\\Installer::ensureReady(); if (!is_file(storage_path('database/brassica.sqlite'))) exit(1); if (!Brassica\\Core\\Installer::needsSetup()) exit(2);"
          rm -f /tmp/v2/web/storage/database/brassica.sqlite

      - name: Replace branch with tested V2 source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v2/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Brassica 2.0 monorepo source'
          git push origin HEAD:v2-monorepo
