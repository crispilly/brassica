name: Bootstrap Brassica 2.0 monorepo

on:
  push:
    branches: [v2-monorepo]
    paths:
      - '.bootstrap/complete'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Brassica 2.0 source
        run: |
          set -euo pipefail
          base64 -d .bootstrap/payload.b64 > /tmp/brassica-v2.tar.gz
          echo 'c6aac790fcaf60668b9004888fd7805f532cd8f62ba128f5e69bb70d52710ca4  /tmp/brassica-v2.tar.gz' | sha256sum -c -
          mkdir -p /tmp/brassica-v2
          tar -xzf /tmp/brassica-v2.tar.gz -C /tmp/brassica-v2
          if grep -Rni --exclude-dir=.git 'digitaldruckshop' /tmp/brassica-v2; then
            echo 'Forbidden branding found.' >&2
            exit 20
          fi
          if find /tmp/brassica-v2 -type f \( -name '*.sqlite' -o -name '*.db' \) -print -quit | grep -q .; then
            echo 'Runtime database found in source tree.' >&2
            exit 21
          fi

      - name: Web syntax and first-start installer test
        run: |
          set -euo pipefail
          find /tmp/brassica-v2/web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          rm -f /tmp/brassica-v2/web/storage/database/brassica.sqlite
          cd /tmp/brassica-v2
          php -r "require 'web/app/bootstrap.php'; Brassica\\Core\\Installer::ensureReady(); if (!is_file(storage_path('database/brassica.sqlite'))) exit(1); if (!Brassica\\Core\\Installer::needsSetup()) exit(2);"
          rm -f /tmp/brassica-v2/web/storage/database/brassica.sqlite

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build Android APK
        working-directory: /tmp/brassica-v2/android
        run: ./gradlew assembleFdroidDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brassica-fdroid-debug-apk
          path: /tmp/brassica-v2/android/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

      - name: Replace branch with tested source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/brassica-v2/. .
          rm -f web/storage/database/brassica.sqlite
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Brassica 2.0 monorepo source'
          git push origin HEAD:v2-monorepo
