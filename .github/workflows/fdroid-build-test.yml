name: F-Droid build test

on:
  push:
    paths:
      - '.fdroid.yml'
      - '.github/workflows/fdroid-build-test.yml'

jobs:
  fdroid-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install current F-Droid tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fdroidserver python3-venv
          python3 -m venv --system-site-packages fdroidserver-env
          ./fdroidserver-env/bin/pip install --upgrade pip
          ./fdroidserver-env/bin/pip install git+https://gitlab.com/fdroid/fdroidserver.git

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run F-Droid build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          . fdroidserver-env/bin/activate
          fdroid --version
          git clone --depth=1 https://gitlab.com/fdroid/fdroiddata.git fdroid-work
          cp docs/fdroid/de.crispilly.brassica.yml fdroid-work/metadata/de.crispilly.brassica.yml
          cd fdroid-work
          fdroid readmeta
          fdroid lint de.crispilly.brassica
          fdroid build de.crispilly.brassica --verbose 2>&1 | tee ../fdroid-build.log
          cd ..
          if grep -Eq 'Could not build app|[1-9][0-9]* build failed|ERROR:' fdroid-build.log; then
            echo "F-Droid reported a build failure."
            exit 1
          fi
          grep -Eq 'Successfully built|build succeeded|1 build succeeded|Finished' fdroid-build.log
