name: Android start smoke test

on:
  push:
    paths:
      - '.github/workflows/android-start-smoke.yml'
      - 'android/app/src/androidTest/java/com/flauschcode/broccoli/MainActivityLaunchTest.java'
      - 'android/app/src/main/java/com/flauschcode/broccoli/recipe/list/RecipeFragment.java'

jobs:
  start-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        working-directory: .
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run startup smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedFdroidDebugAndroidTest --stacktrace
