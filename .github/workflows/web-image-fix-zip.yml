name: Build Brassica image fix ZIP

on:
  push:
    paths:
      - '.github/workflows/web-image-fix-zip.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image fix ZIP
        run: |
          set -euo pipefail
          cd web
          zip -r ../Brassica-Web-2.0.4-Image-Fix.zip \
            app/Legacy/api/recipe_get.php \
            app/Legacy/api/collections_recipes.php
      - uses: actions/upload-artifact@v4
        with:
          name: Brassica-Web-2.0.4-Image-Fix
          path: Brassica-Web-2.0.4-Image-Fix.zip
          if-no-files-found: error
