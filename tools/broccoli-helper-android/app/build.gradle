plugins {
    id 'com.android.application'
}

android {
    namespace 'de.crispilly.broccolihelper'
    compileSdk 35

    defaultConfig {
        applicationId 'de.crispilly.broccolihelper'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
